name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pinned to the tag matching "minGloom" in gloom.json. Bump both together.
      GLOOMBERB_TAG: v0.17.2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # Mirrors what Gloomberb does at install time: link the host rather than
      # depending on it, so there is exactly one copy of gloomberb and react and
      # typecheck runs against the same module graph the app loads the plugin into.
      - name: Link the Gloomberb host
        run: |
          git clone --depth 1 --branch "$GLOOMBERB_TAG" https://github.com/gloom-sh/gloomberb.git "$RUNNER_TEMP/gloomberb"
          bun install --cwd "$RUNNER_TEMP/gloomberb"
          mkdir -p node_modules
          ln -sfn "$RUNNER_TEMP/gloomberb" node_modules/gloomberb
          ln -sfn "$RUNNER_TEMP/gloomberb/node_modules/react" node_modules/react

      - run: bun run typecheck
      - run: bun test

      # Opens the IEX websocket, authenticates and subscribes, then exits. Skipped
      # on forks and PRs from forks, where the repository secrets are not available.
      - name: Websocket handshake
        if: ${{ env.APCA_API_KEY_ID != '' && env.APCA_API_SECRET_KEY != '' }}
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: bun scripts/observe-stream.ts --handshake --seconds 20
