name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Link the Gloomberb host
        uses: ./.github/actions/link-host
        with:
          # The tag matching "minGloom" in gloom.json. Bump both together.
          tag: v0.17.2

      - run: bun run typecheck
      - run: bun test

      # Opens the IEX websocket, authenticates and subscribes, then exits. Skipped
      # on forks and PRs from forks, where the repository secrets are not available.
      - name: Websocket handshake
        if: ${{ env.APCA_API_KEY_ID != '' && env.APCA_API_SECRET_KEY != '' }}
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: bun scripts/observe-stream.ts --handshake --seconds 20
